[build]
builder = "NIXPACKS"
# 1. Install backend dependencies (for the server)
# 2. Install website dependencies (for the build)
# 3. Build the website (creates /website/dist)
buildCommand = "npm install --prefix backend && npm install --prefix website && npm run build --prefix website"

[deploy]
# Start the backend server
# Note: server.js handles serving the ../website/dist static files
startCommand = "node backend/server.js"

[restartPolicy]
type = "ON_FAILURE"
limit = 5
