<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BatchMyPhotos — Automatically organize thousands of photos into smart batches. Try the interactive demo."
    />
    <meta property="og:title" content="BatchMyPhotos — Smart Photo Batch Organizer" />
    <meta
      property="og:description"
      content="Organize 10,000+ photos into smart batches in seconds. Try the free interactive demo."
    />
    <meta property="og:type" content="website" />
    <title>BatchMyPhotos — Smart Photo Batch Organizer</title>

    <!-- Apply theme class before paint to avoid a flash (mirrors ThemeContext: default 'dark') -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bmp-theme') || 'dark'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Darkroom typography: Fraunces (display) · Hanken Grotesk (body) · Spline Sans Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
